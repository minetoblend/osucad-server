ktor:
  application:
    modules:
      - com.osucad.server.ApplicationKt.module
      - com.osucad.server.modules.users.ModuleKt.usersModule
      - com.osucad.server.modules.osu.ModuleKt.osuModule

  deployment:
    port: 8080

oauth:
  redirectUrl: $OSU_OAUTH_REDIRECT_URL
  clientId: $OSU_OAUTH_CLIENT_ID
  clientSecret: $OSU_OAUTH_CLIENT_SECRET

database:
  url: r2dbc:h2:mem:///test;DB_CLOSE_DELAY=-1
  driver: h2
  user: root
  password: ''

flyway:
  url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
  user: root
  password: ''
